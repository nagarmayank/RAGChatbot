apiVersion: v1
kind: PersistentVolume
metadata:
  name: qdrant-pv
  namespace: ragchatbot
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: ragchatbot
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant-db
  namespace: ragchatbot
spec:
  selector:
    matchLabels:
      app: qdrant-db
  serviceName: qdrant-db
  replicas: 1
  template:
    metadata:
      labels:
        app: qdrant-db
        namespace: ragchatbot
    spec:
      containers:
      - name: qdrant-db
        image: qdrant/qdrant
        ports:
        - containerPort: 6333
          name: web
        - containerPort: 6334
          name: grpc        
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
  volumeClaimTemplates:
  - metadata:
      name: qdrant-data
      namespace: ragchatbot
    spec:
      accessModes: [ "ReadWriteMany" ]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-db-svc
  namespace: ragchatbot
spec:
  selector:
    app: qdrant-db
  ports:
    - name: web
      protocol: TCP
      port: 6333
      targetPort: 6333
    - name: grpc
      protocol: TCP
      port: 6334
      targetPort: 6334

---
apiVersion: v1
kind: Pod
metadata:
  name: qdrant-db-pod
  namespace: ragchatbot
spec:
  containers:
  - name: qdrant-db
    image: qdrant/qdrant
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1024Mi"